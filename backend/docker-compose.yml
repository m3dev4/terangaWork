services:
  web:
    build: .
    env_file: .env
    environment:
      FASTAPI_MATCHING_URL: http://ia:8000
    depends_on:
      ia:
        condition: service_healthy
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/docs/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ia:
    build: ../ia
    env_file: ../ia/.env
    environment:
      DJANGO_BASE_URL: http://web:8000/api
      INTERNAL_API_KEY: ${FASTAPI_INTERNAL_API_KEY:?Configure FASTAPI_INTERNAL_API_KEY dans backend/.env}
      DJANGO_INTERNAL_API_KEY: ${FASTAPI_INTERNAL_API_KEY:?Configure FASTAPI_INTERNAL_API_KEY dans backend/.env}
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # MySQL local pour tester. Lancé uniquement avec: docker compose --profile local up
  # En production sur AWS, on n'utilise pas ce service: DB_HOST pointe vers RDS.
  db:
    image: mysql:8.4
    profiles: ["local"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE_NAME}
      MYSQL_USER: ${MYSQL_DATABASE_USER}
      MYSQL_PASSWORD: ${MYSQL_DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # HTTPS en production : docker compose --profile prod up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-16-16-210-226.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        # URL vue par le navigateur, pas par les conteneurs
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/}
        VITE_WS_URL: ${VITE_WS_URL:-}
    depends_on:
      - web
    ports:
      - "5173:80"
    restart: unless-stopped
    
volumes:
  mysql_data:
  caddy_data:
  caddy_config:

